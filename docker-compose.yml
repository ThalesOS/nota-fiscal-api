version: '3.8'

services:
  postgres-db:
    image: postgres:16
    container_name: pg-nota-fiscal
    environment:
      POSTGRES_USER: root
      POSTGRES_PASSWORD: root
      POSTGRES_DB: notafiscal_db
      TZ: America/Sao_Paulo
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U root -d notafiscal_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: pgadmin-nota-fiscal
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: root
    ports:
      - "8080:80"
    depends_on:
      - postgres-db

  nota-fiscal-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: api-nota-fiscal
    ports:
      - "8081:8081"
    environment:
      TZ: America/Sao_Paulo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres-db:5432/notafiscal_db
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: root
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
    depends_on:
      postgres-db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: web-nota-fiscal
    environment:
      TZ: America/Sao_Paulo
    ports:
      - "3000:80"
    depends_on:
      - nota-fiscal-api

volumes:
  pgdata:
