spring.application.name=nota-fiscal-api

spring.datasource.url=jdbc:postgresql://localhost:5432/notafiscal_db
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=org.postgresql.Driver
server.port=8081

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jackson.time-zone=America/Sao_Paulo

# Integração SEFAZ - SVRS, NF-e, ambiente de homologação
sefaz.autorizacao.url=${SEFAZ_AUTORIZACAO_URL:https://nfe-homologacao.svrs.rs.gov.br/ws/NfeAutorizacao/NFeAutorizacao4.asmx}
# Certificado digital A1 (.pfx) da empresa. Sem ele, a SEFAZ recusa o acesso (HTTP 403).
sefaz.certificado.caminho=${SEFAZ_CERTIFICADO_CAMINHO:}
sefaz.certificado.senha=${SEFAZ_CERTIFICADO_SENHA:}
